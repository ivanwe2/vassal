[project]
name = "vassal"
version = "0.0.1"
description = "A plan compiler that lets a frontier model command a local agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "hypothesis>=6.112", "ruff>=0.6"]

[project.scripts]
vassal = "vassal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vassal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
